<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пластиковые окна в Липецке от завода-производителя — Липецкие окна</title>
<link rel="stylesheet" href="fonts-local.css">
<link rel="stylesheet" href="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/tokens/colors.css">
<link rel="stylesheet" href="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/tokens/typography.css">
<link rel="stylesheet" href="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/tokens/spacing.css">
<link rel="stylesheet" href="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/tokens/radius.css">
<link rel="stylesheet" href="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/tokens/elevation.css">
<link rel="stylesheet" href="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/tokens/motion.css">
<link rel="stylesheet" href="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/tokens/base.css">
<style>
.container{max-width:var(--container-max);margin:0 auto;padding:0 var(--space-8)}
.section{padding:var(--space-24) 0}
.section--tight{padding:var(--space-16) 0}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-6)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-6)}
.hero{background:linear-gradient(180deg,var(--red-50),var(--white));padding:var(--space-20) 0 var(--space-24)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--space-16);align-items:center}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--gray-500)}
.only-mobile{display:none}
.ph{border:1px dashed var(--gray-300);border-radius:var(--radius-image);background:var(--gray-25);display:flex;align-items:center;justify-content:center;color:var(--gray-400);font-size:var(--text-xs);text-align:center;padding:var(--space-4)}
.seo-body h3{font-size:var(--text-md);color:var(--text-primary);margin:var(--space-6) 0 var(--space-2)}
.salon-grid{display:grid;grid-template-columns:1.15fr .85fr;align-items:stretch}
.salon-grid>iframe,.salon-grid>.ph{height:auto!important;align-self:stretch;min-height:380px;border-right:1px solid var(--border-subtle)}
.seo-body ul{margin:0 0 var(--space-4);padding-left:1.1em}
.seo-body li{margin-bottom:6px}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
header a[aria-label^="Липецкие окна"]{flex:none;padding-right:var(--space-2)!important}
header a[aria-label^="Липецкие окна"] img{max-width:none;width:auto;flex:none;height:34px!important}
header>div:first-child>nav{margin-left:0!important}
header>div:first-child>nav ul{gap:var(--space-3)!important}
header>div:first-child>nav a{font-size:var(--text-xs)!important}
header>div:first-child a[href^="tel:"]{font-size:var(--text-base)!important}
/* Сдвиг строки шапки влево: меняйте одно число ниже (например 0px, 24px, 48px) */
:root{--header-shift:0px}
header>div:first-child{padding:var(--space-4) 0!important;max-width:var(--container-max)!important;width:auto!important;margin:12px 0!important;justify-content:center;transform:translateX(calc(-1 * var(--header-shift)))}
header>div:first-child>a[aria-label^="Липецкие окна"] img{margin-left:55px}
header>div:first-child>div:last-child{margin-left:60px!important}
footer>div{padding-left:var(--space-8)!important;padding-right:var(--space-8)!important}
footer a[aria-label^="Липецкие окна"] img{max-width:none;width:auto}
@media(max-width:900px){
.container{padding:0 var(--space-4)}
.section{padding:var(--space-12) 0}
.section--tight{padding:var(--space-10) 0}
.hero{padding:var(--space-10) 0 var(--space-12)}
.hero-grid{grid-template-columns:1fr;gap:var(--space-8)}
.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;gap:var(--space-4)}
.salon-grid{grid-template-columns:1fr}
.salon-grid>iframe,.salon-grid>.ph{min-height:240px;border-right:none;border-bottom:1px solid var(--border-subtle)}
.only-mobile{display:block}
.only-desktop{display:none}
header>div:first-child{padding-left:var(--space-4)!important;padding-right:var(--space-4)!important;transform:none!important;margin:0 auto!important;justify-content:flex-start}
header>div:first-child>a[aria-label^="Липецкие окна"] img{margin-left:0}
header>div:first-child>div:last-child{margin-left:auto!important}
footer>div{padding-left:var(--space-4)!important;padding-right:var(--space-4)!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="ds/design-system-52c6a758-9cca-45a7-a609-e4783194f202/ds_bundle.js"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="home-parts1.jsx"></script>
<script type="text/babel" src="home-parts2.jsx"></script>

</body>
</html>
