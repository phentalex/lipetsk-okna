<style>
body{background:var(--white)}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--space-8)}
.kit-bar{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--border-subtle)}
.kit-bar .wrap{display:flex;align-items:center;gap:var(--space-6);min-height:72px}
.caps{font-size:13px;font-weight:600;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--gray-500)}
.sec{padding:var(--space-16) 0;border-top:1px solid var(--border-subtle)}
.sec:first-of-type{border-top:none}
.sec-head{display:grid;grid-template-columns:180px 1fr;gap:var(--space-8);margin-bottom:var(--space-10)}
.row{display:grid;grid-template-columns:180px 1fr;gap:var(--space-8);padding:var(--space-6) 0;border-top:1px solid var(--gray-100)}
.row:first-of-type{border-top:none}
.spec{font-size:var(--text-2xs);color:var(--gray-500);font-family:var(--font-body)}
.grid-auto{display:grid;gap:var(--space-4)}
.swatch{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:var(--white)}
.swatch .chip{height:64px}
.swatch .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--gray-600)}
.panel{background:var(--gray-50);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-6)}
.states{display:grid;grid-template-columns:120px repeat(5,1fr);gap:var(--space-4);align-items:center}
.states .hdr{font-size:13px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--gray-500);font-weight:600}
.colgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--space-8)}
.colgrid span{height:56px;background:var(--red-50);border:1px solid var(--red-100);border-radius:var(--radius-xs)}
.ph{border:1px dashed var(--gray-300);border-radius:var(--radius-image);background:var(--gray-25);display:flex;align-items:center;justify-content:center;color:var(--gray-400);font-size:var(--text-xs)}
a.navlink{font-size:var(--text-sm);color:var(--text-secondary);text-decoration:none}
a.navlink:hover{color:var(--text-link-hover)}
</style>
